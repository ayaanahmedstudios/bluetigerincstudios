<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blue Tiger Inc Studios</title>
<meta name="theme-color" content="#040504">
<meta name="description" content="sup, im the blue tiger.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23040504'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%2300c4b6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500&family=Geist+Pixel&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#00c4b6; --deep:#00766e; --bg:#040504; --ink:#eeeeee; --dim:#7d847d; --faint:#4b524b; --line:#1d231d;
  --sans:'Geist',system-ui,sans-serif; --pixel:'Geist Pixel','Geist',monospace;
  --pad:clamp(16px,3.2vw,32px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{overscroll-behavior:none}
html,body{width:100%;height:100dvh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--bg);color:var(--ink);overflow:hidden;
  font:500 15px/1.4 var(--sans);font-synthesis:none;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
body{touch-action:none}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:8px}

#world{position:fixed;left:0;top:0;z-index:0;pointer-events:none;transition:opacity .45s ease}

/* header */
header{position:fixed;z-index:10;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;
  padding:max(14px,env(safe-area-inset-top)) var(--pad) 22px;
  background:linear-gradient(var(--bg) 40%,rgba(4,5,4,0))}
.brand{display:flex;align-items:center;gap:6px;min-height:40px;font-size:15px;letter-spacing:-.01em}
nav{display:flex;align-items:center;gap:4px}
nav a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:9px;color:var(--dim);transition:color .15s,background .15s,border-color .15s}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--teal)}
nav a.yt{margin-left:6px;border:1px solid var(--line);color:var(--ink)}
nav a.yt:hover{border-color:var(--teal);color:var(--teal)}
.arr{width:.78em;height:.78em;flex:none}

/* buttons: two, same height, same radius */
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media(max-width:520px){#msg .btns{flex-direction:column;width:min(300px,100%)}#msg .btn{width:100%}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 22px;border-radius:10px;
  font-size:15px;border:1px solid var(--line);color:var(--ink);background:rgba(4,5,4,.5);transition:border-color .15s,background .15s,transform .1s,box-shadow .2s}
.btn:hover{border-color:#3a443a;background:#0b0e0b}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#021210;}
.btn.primary:hover{background:#17d8ca;border-color:#17d8ca}

.pix{font-family:var(--pixel);font-weight:400}
.hint{position:fixed;z-index:5;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));text-align:center;font-size:13px;color:var(--faint);pointer-events:none}
.hint b{font-family:var(--pixel);font-weight:400;color:var(--dim)}


.btn .arr{transition:transform .2s ease}.btn:hover .arr{transform:translate(2px,-2px)}

#world{opacity:.17}
body[data-scene=tiger] #world{opacity:1}
#stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:64px var(--pad) 40px;pointer-events:none}
body[data-scene=tiger] #stage{opacity:0;visibility:hidden;transition:opacity .3s .35s,visibility 0s .7s}
#hero{pointer-events:auto;font-family:var(--pixel);font-weight:400;font-size:clamp(2.6rem,min(12.4vw,16vh),11rem);line-height:1.04;text-align:center;
  overflow-wrap:anywhere;max-width:min(94vw,1400px);color:var(--ink);position:relative;isolation:isolate}
#hero::before{content:'';position:absolute;inset:-18% -8%;z-index:-1;background:radial-gradient(ellipse at center,rgba(4,5,4,.78),rgba(4,5,4,0) 68%);pointer-events:none}
#hero .ch{display:inline-block;white-space:pre;will-change:transform}
#world.swap{opacity:0!important;transition-duration:.18s}
body.portrait[data-scene=home] #world{opacity:1}
body.portrait #stage{justify-content:flex-end;padding-bottom:max(44px,calc(env(safe-area-inset-bottom) + 30px))}
body.portrait #hero{font-size:clamp(2.4rem,13vw,5.5rem)}
body.portrait #cta{width:min(340px,100%)}body.portrait #cta .btn{width:100%;height:54px;font-size:16px}
#hero .t{color:var(--teal)}
#cur{display:inline-block;width:.5em;height:.8em;margin-left:.06em;vertical-align:-.04em;background:var(--teal);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#cta{margin-top:clamp(1.4rem,4.5vh,2.6rem);pointer-events:auto;opacity:0}
#cta.show{opacity:1}
</style>
</head>
<body data-scene="home">
<canvas id="world" aria-hidden="true"></canvas>

<header>
  <a class="brand" href="#" id="brand" aria-label="Blue Tiger Inc Studios, home"><span id="brandt">Blue Tiger Inc Studios</span></a>
</header>

<main id="stage">
  <h1 id="hero" aria-label="sup, im the blue tiger."><span id="t1"></span><br><span id="t2" class="t"></span><i id="cur"></i></h1>
  <div id="cta" class="btns">
    <a class="btn primary" href="https://youtube.com/@BlueTigerIncStudios" target="_blank" rel="noopener">Watch on YouTube <svg class="arr" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true"><path d="M3 9l6-6M4 3h5v5"/></svg></a>
  </div>
</main>

/* ─────────── hero: every character is its own element, animated with anime.js ─────────── */
let buf = '', typeTok = 0, typedDone = false;
const L1 = 'sup, im the', L2 = 'blue tiger.';
function addChar(el, ch) {
  if (ch === '\n') { const br = document.createElement('br'); el.appendChild(br); return br; }
  const sp = document.createElement('span'); sp.className = 'ch'; sp.textContent = ch; el.appendChild(sp); return sp;
}
const rnd = (a, b) => a + Math.random() * (b - a);
const chars = () => [...hero.querySelectorAll('.ch')];
const pop = sp => { if (!reduce && sp.className === 'ch') animate(sp, { opacity: [0, 1], translateY: [rnd(0.5, 1.1) + 'em', 0], translateX: [rnd(-0.35, 0.35) + 'em', 0], rotate: [rnd(-45, 45), 0], scale: [rnd(1.5, 2.2), 1], duration: 1100, ease: 'outElastic(1,.5)' }); };
function flourish() { if (!reduce) animate(chars(), { translateY: [{ to: '-0.09em', duration: 200, ease: 'outQuad' }, { to: 0, duration: 800, ease: 'outElastic(1,.4)' }], rotate: [{ to: () => rnd(-6, 6), duration: 200 }, { to: 0, duration: 800, ease: 'outElastic(1,.4)' }], delay: stagger(36) }); }
function showCta() { cta.classList.add('show'); if (!reduce) animate(cta.children, { opacity: [0, 1], scale: [0.7, 1], translateY: ['0.8em', 0], duration: 1100, ease: 'outElastic(1,.55)', delay: stagger(90) }); }
function scatter(from) {                                   // tap or click the heading: everything flies apart and springs back
  if (reduce) return; const cs = chars(); if (!cs.length) return;
  animate(cs, {
    translateX: [{ to: () => rnd(-1.6, 1.6) + 'em', duration: 320, ease: 'outCubic' }, { to: 0, duration: 1100, ease: 'outElastic(1,.45)' }],
    translateY: [{ to: () => rnd(-1.4, 1.4) + 'em', duration: 320, ease: 'outCubic' }, { to: 0, duration: 1100, ease: 'outElastic(1,.45)' }],
    rotate: [{ to: () => rnd(-200, 200), duration: 320, ease: 'outCubic' }, { to: 0, duration: 1100, ease: 'outElastic(1,.45)' }],
    scale: [{ to: () => rnd(0.4, 1.8), duration: 320 }, { to: 1, duration: 1100, ease: 'outElastic(1,.45)' }],
    delay: stagger(16, { from })
  });
}
function leave() { if (reduce) return; animate(chars(), { translateY: () => rnd(-2.4, -0.8) + 'em', rotate: () => rnd(-90, 90), scale: 0.3, opacity: 0, duration: 520, ease: 'inBack', delay: stagger(18, { from: 'center' }) }); }
function intro() {
  const tok = ++typeTok; typedDone = false; t1.textContent = t2.textContent = ''; cta.classList.remove('show'); t1.before(cur);
  const all = [...L1].map(c => [c, t1]).concat([...L2].map(c => [c, t2]));
  let i = 0;
  (function next() {
    if (tok !== typeTok) return;
    if (i >= all.length) { typedDone = true; showCta(); flourish(); return; }
    const [ch, el] = all[i++], sp = addChar(el, ch); pop(sp); el.after(cur);
    setTimeout(next, reduce ? 0 : 42 + Math.random() * 55 + (ch === ',' || ch === '.' ? 210 : 0) + (i === L1.length + 1 ? 90 : 0));
  })();
}
function renderBuf(grew) {
  typeTok++; typedDone = true; cta.classList.add('show');
  if (!buf) { intro(); return; }
  t1.textContent = t2.textContent = '';
  const chars = [...buf]; chars.forEach((c, i) => { const sp = addChar(t1, c); if (grew && i === chars.length - 1) pop(sp); });
  t1.after(cur);
}
hero.addEventListener('pointerdown', e => { const t = e.target; if (navigator.vibrate && e.pointerType === 'touch') navigator.vibrate(10); scatter(t.className === 'ch' ? chars().indexOf(t) : 'center'); });
function hop(t) { if (reduce || !t || t.className !== 'ch' || t._hop) return; t._hop = 1; animate(t, { translateY: ['-0.16em', 0], duration: 650, ease: 'outElastic(1,.7)', onComplete: () => { t._hop = 0; } }); }
hero.addEventListener('pointerover', e => { if (fine) hop(e.target); });
const go = n => { location.hash = n === 'home' ? '' : n; route(); };
const open = () => window.open(YT, '_blank', 'noopener');
const COMMANDS = {
  youtube: open, videos: open, tiger: () => go('tiger'), piano: () => { location.href = '/piano.html'; }, home: () => go('home'),
  clear: () => { buf = ''; renderBuf(); }
};
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') { if (scene !== 'home') go('home'); else { buf = ''; renderBuf(); } return; }
  if (scene !== 'home') return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('a,button')) return;
  if (e.key === 'Enter') {
    const fn = COMMANDS[buf.split('\n').pop().trim().toLowerCase()];
    if (fn) { e.preventDefault(); buf = ''; renderBuf(); fn(); } else if (buf) { buf += '\n'; renderBuf(true); }
  } else if (e.key === 'Backspace') { buf = buf.slice(0, -1); renderBuf(); e.preventDefault(); }
  else if (e.key.length === 1 && buf.length < 60) { buf += e.key; renderBuf(true); if (e.key === ' ') e.preventDefault(); }
});

/* ─────────── tiger: a blocky bust, lit and halftoned. eyes follow the light ─────────── */
const T = {};
function buildTiger() {
  eng.wipeAll();
  const { W, H, cw, ch, cols, rows } = S;
  const top = portrait && scene === 'home', y0 = top ? 64 : 80, y1 = top ? H * 0.52 : H - 40;               // on a phone the tiger sits above the text
  const s = Math.min(W * (portrait ? 0.6 : 0.46), (y1 - y0 - (top ? 16 : 80)) / 1.75), cx = W / 2, cy = (y0 + y1) / 2 - 0.16 * s;      // s = width of the head
  const P = (g, pts) => { g.beginPath(); pts.forEach(([x, y], n) => n ? g.lineTo(cx + x * s, cy + y * s) : g.moveTo(cx + x * s, cy + y * s)); g.closePath(); g.fill(); };
  const E = (g, x, y, rx, ry) => { g.beginPath(); g.ellipse(cx + x * s, cy + y * s, rx * s, ry * s, 0, 0, 7); g.fill(); };
  const both = fn => { fn(1); fn(-1); };
  const EY = { x: 0.16, y: -0.06, rx: 0.06, ry: 0.055 };
  T.cov = eng.cover(g => { g.fillStyle = '#fff';
    P(g, [[-0.34, -0.43], [0.34, -0.43], [0.5, -0.02], [0.21, 0.43], [-0.21, 0.43], [-0.5, -0.02]]);                      // head
    both(m => P(g, [[0.08 * m, -0.43], [0.15 * m, -0.69], [0.41 * m, -0.58], [0.34 * m, -0.43]]));                         // two ears
    both(m => P(g, [[0.19 * m, 0.4], [0.46 * m, 0.3], [0.62 * m, 0.52], [0.52 * m, 0.64], [0.3 * m, 0.46]]));              // shoulders
    both(m => P(g, [[0.62 * m, 0.5], [0.72 * m, 0.98], [0.58 * m, 1.0], [0.5 * m, 0.62]]));                                 // arms
    P(g, [[-0.21, 0.4], [0.21, 0.4], [0.43, 0.52], [0.5, 1.0], [-0.5, 1.0], [-0.43, 0.52]]); });                             // chest
  const ink = eng.cover(g => { g.fillStyle = '#fff';
    both(m => { P(g, [[0.78 * m, 0.8], [0.7 * m, 0.76], [0.66 * m, 0.86]]); P(g, [[0.8 * m, 0.94], [0.72 * m, 0.9], [0.68 * m, 0.99]]); });
    P(g, [[-0.22, 0.43], [0.22, 0.43], [0.24, 0.47], [-0.24, 0.47]]);                                                        // neck line
    for (let n = 0; n < 4; n++) { const x = -0.15 + n * 0.1; P(g, [[x, 0.92], [x + 0.045, 0.66], [x + 0.075, 0.62], [x + 0.07, 0.7], [x + 0.02, 0.93]]); }   // claw slashes
    P(g, [[-0.045, 0.08], [0.045, 0.08], [0, 0.135]]); });                                                                   // nose
  const eyeL = eng.cover(g => { g.fillStyle = '#fff'; E(g, -EY.x, EY.y, EY.rx, EY.ry); });
  const eyeR = eng.cover(g => { g.fillStyle = '#fff'; E(g, EY.x, EY.y, EY.rx, EY.ry); });
  const N = cols * rows;
  T.ink = new Uint8Array(N); T.eye = new Uint8Array(N);
  for (let i = 0; i < N; i++) { T.ink[i] = ink[i] > 0.45; T.eye[i] = eyeL[i] > 0.4 ? 1 : eyeR[i] > 0.4 ? 2 : 0; }
  Object.assign(T, eng.relief(T.cov, s * 0.12, eng.blur(Float32Array.from(T.ink), 1), s * 0.04));
  T.soft = eng.blur(T.cov, 2); T.shadowLen = s * 0.07; T.box = eng.bounds(T.cov, Math.ceil(T.shadowLen / cw) + 3);
  T.eyes = [-1, 1].map(m => ({ cx: (cx + EY.x * m * s) / cw, cy: (cy + EY.y * s) / ch, rx: EY.rx * s / cw, ry: EY.ry * s / ch }));
  T.thr = eng.thresholds(cx / cw, cy / ch); T.rev = reduce ? 9 : 0;
}
function drawTiger() {
  const { cols, rows } = S, L = light.cur, lz = 0.8, inv = 1 / Math.hypot(L.x, L.y, lz), Lx = L.x * inv, Ly = L.y * inv, Lz = lz * inv;
  const sdx = -L.x * T.shadowLen / S.cw, sdy = -L.y * T.shadowLen / S.ch, px = clamp(L.x, -1, 1), py = clamp(L.y, -1, 1);
  const [bc0, br0, bc1, br1] = T.box; eng.wipe(bc0, br0, bc1 + 1, br1 + 1);
  for (let r = br0; r <= br1; r++) for (let c = bc0; c <= bc1; c++) {
    const i = r * cols + c, rv = clamp((T.rev - T.thr[i]) * 7, 0, 1);
    if (rv <= 0) continue;
    let ci, col;
    if (T.cov[i] > 0.5) {
      if (T.ink[i]) continue;                                    // ink: nose, slashes, notches are cut out of the body
      const ey = T.eye[i];
      if (ey) {
        const e = T.eyes[ey - 1], dx = (c + 0.5 - e.cx - px * e.rx * 0.4) / (e.rx * 0.6), dy = (r + 0.5 - e.cy - py * e.ry * 0.3) / (e.ry * 0.8);
        if (dx * dx + dy * dy <= 1) continue;
        ci = 5; col = 3;
      } else {
        const v = 0.34 + 0.66 * Math.pow(Math.max(0, T.nx[i] * Lx + T.ny[i] * Ly + T.nz[i] * Lz), 2.6);
        const t = tone(Math.max(v, T.rim[i] ? 0.55 : 0), r, c, T.rim[i], 0.7);
        if (t < 0) continue; ci = t >> 2; col = t & 3;
      }
    } else {
      const sr = Math.round(r + sdy), sc = Math.round(c + sdx);
      if (sr < 0 || sc < 0 || sr >= rows || sc >= cols) continue;
      const v = T.soft[sr * cols + sc];
      if (v < 0.2 || (r + c) % 2) continue;
      ci = v > 0.6 ? 2 : 1; col = 0;
    }
    if (rv < 1) ci = Math.max(1, (ci * rv) | 0);
    eng.put(c, r, ci, col);
  }
}

/* ─────────── light, routing, resize ─────────── */
const light = eng.createLight(() => drawTiger());
const lit = () => scene === 'tiger' || portrait;          // is the tiger the star of the screen right now?
let touching = false, lastHop = 0;
addEventListener('pointermove', e => {
  if (lit()) light.set(...eng.lightFromPointer(e.clientX, e.clientY));
  if (e.pointerType === 'touch' && scene === 'home' && e.timeStamp - lastHop > 45) { lastHop = e.timeStamp; hop(document.elementFromPoint(e.clientX, e.clientY)); }
}, { passive: true });
addEventListener('pointerdown', e => { touching = e.pointerType !== 'mouse'; if (lit()) light.set(...eng.lightFromPointer(e.clientX, e.clientY)); }, { passive: true });
addEventListener('pointerup', () => { touching = false; }, { passive: true });
document.addEventListener('pointerleave', () => { if (fine && lit()) light.set(-0.55, -0.7); });
/* phones: tilt the device and the light moves across the tiger */
if (!fine && window.DeviceOrientationEvent) {
  const on = () => addEventListener('deviceorientation', e => { if (e.gamma == null || touching || !lit()) return; light.set(clamp(e.gamma / 26, -1.1, 1.1), clamp((e.beta - 55) / 26, -1.1, 1.1)); }, { passive: true });
  if (typeof DeviceOrientationEvent.requestPermission === 'function') addEventListener('pointerdown', () => { DeviceOrientationEvent.requestPermission().then(r => r === 'granted' && on()).catch(() => {}); }, { once: true });
  else on();
}

function route() {
  const s = location.hash.replace(/^#\/?/, '') === 'tiger' ? 'tiger' : 'home';
  if (booted && s === scene) return;
  if (booted && scene === 'home' && s !== 'home') { typeTok++; typedDone = false; buf = ''; leave(); }
  const wasTop = portrait && scene === 'home'; scene = s; body.dataset.scene = s;
  if (booted && portrait && wasTop !== (portrait && s === 'home')) { canvas.classList.add('swap'); setTimeout(() => { buildTiger(); T.rev = 9; drawTiger(); canvas.classList.remove('swap'); }, 190); }
  document.title = s === 'home' ? 'Blue Tiger Inc Studios' : 'Tiger · Blue Tiger Inc Studios';
  document.querySelectorAll('nav a[data-s]').forEach(a => a.classList.toggle('on', a.dataset.s === s));
  if (booted && s === 'home' && !typedDone) intro();
}
addEventListener('hashchange', route);

const measure = () => { portrait = innerHeight / innerWidth > 1.25 && innerWidth < 820; body.classList.toggle('portrait', portrait); };
let rz = 0, lastW = innerWidth, lastH = innerHeight;
addEventListener('resize', () => {
  if (innerWidth === lastW && Math.abs(innerHeight - lastH) < 140) return;   // phone address bar
  clearTimeout(rz); rz = setTimeout(() => { lastW = innerWidth; lastH = innerHeight; measure(); eng.layout(); buildTiger(); T.rev = 9; drawTiger(); }, 160);
});

async function start() {
  try { await Promise.race([document.fonts.load('16px "Geist Pixel"'), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
  const bt = $('#brandt'); scramble(bt, 'Blue Tiger Inc Studios', 1100); $('#brand').addEventListener('pointerenter', () => scramble(bt, 'Blue Tiger Inc Studios', 700));
  measure(); eng.layout(); buildTiger(); route(); booted = true;
  T.rev = 0; eng.tween(1500, k => { T.rev = k * 1.35; drawTiger(); });
  if (scene === 'home') intro();
  document.fonts.ready.then(() => { measure(); eng.layout(); buildTiger(); T.rev = 9; drawTiger(); });
}
start();
})();
</script>
</body>
</html>
