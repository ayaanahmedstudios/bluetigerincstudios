<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blue Tiger Inc Studios</title>
<meta name="theme-color" content="#040504">
<meta name="description" content="sup, im the blue tiger.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23040504'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%2300c4b6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500&family=Geist+Pixel&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#00c4b6; --deep:#00766e; --bg:#040504; --ink:#eeeeee; --dim:#7d847d; --faint:#4b524b; --line:#1d231d;
  --sans:'Geist',system-ui,sans-serif; --pixel:'Geist Pixel','Geist',monospace;
  --pad:clamp(16px,3.2vw,32px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100dvh;background:var(--bg);color:var(--ink);overflow:hidden;
  font:500 15px/1.4 var(--sans);font-synthesis:none;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;text-transform:lowercase}
body{touch-action:none}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:8px}

#world{position:fixed;left:0;top:0;z-index:0;pointer-events:none;transition:opacity .45s ease}

/* header */
header{position:fixed;z-index:10;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;
  padding:max(14px,env(safe-area-inset-top)) var(--pad) 22px;
  background:linear-gradient(var(--bg) 40%,rgba(4,5,4,0))}
.brand{display:flex;align-items:center;gap:10px;min-height:40px;font-size:15px;letter-spacing:-.01em}
.mark{width:10px;height:10px;background:var(--teal);box-shadow:0 0 14px rgba(0,196,182,.55)}
.brand .long{color:var(--dim)}
nav{display:flex;align-items:center;gap:4px}
nav a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:9px;color:var(--dim);transition:color .15s,background .15s,border-color .15s}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--teal)}
nav a.yt{margin-left:6px;border:1px solid var(--line);color:var(--ink)}
nav a.yt:hover{border-color:var(--teal);color:var(--teal)}
.arr{width:.78em;height:.78em;flex:none}

/* buttons: two, same height, same radius */
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media(max-width:520px){#msg .btns{flex-direction:column;width:min(300px,100%)}#msg .btn{width:100%}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 22px;border-radius:10px;
  font-size:15px;border:1px solid var(--line);color:var(--ink);background:rgba(4,5,4,.5);transition:border-color .15s,background .15s,transform .1s,box-shadow .2s}
.btn:hover{border-color:#3a443a;background:#0b0e0b}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#021210;
  box-shadow:0 0 0 1px rgba(0,196,182,.25),0 10px 34px -10px rgba(0,196,182,.6)}
.btn.primary:hover{background:#17d8ca;border-color:#17d8ca}

.pix{font-family:var(--pixel);font-weight:400}
.hint{position:fixed;z-index:5;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));text-align:center;font-size:13px;color:var(--faint);pointer-events:none}
.hint b{font-family:var(--pixel);font-weight:400;color:var(--dim)}
@media(max-width:520px){.brand .long{display:none}nav a{padding:0 10px}}

#world{opacity:.17}
body[data-scene=tiger] #world,body[data-scene=piano] #world{opacity:1}
#world.swap{opacity:0!important;transition-duration:.18s}

#stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:64px var(--pad) 40px;pointer-events:none;transition:opacity .35s ease,transform .35s ease}
body:not([data-scene=home]) #stage{opacity:0;transform:translateY(8px);visibility:hidden;transition:opacity .25s,transform .25s,visibility 0s .25s}
#hero{font-family:var(--pixel);font-weight:400;font-size:clamp(2.6rem,min(12.4vw,16vh),11rem);line-height:1.04;text-align:center;
  white-space:pre-wrap;overflow-wrap:anywhere;max-width:min(94vw,1400px);color:var(--ink);
  text-shadow:0 2px 30px #040504,0 0 3px #040504}
#hero .t{color:var(--teal)}
#cur{display:inline-block;width:.5em;height:.8em;margin-left:.06em;vertical-align:-.04em;background:var(--teal);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#cta{margin-top:clamp(1.4rem,4.5vh,2.6rem);pointer-events:auto;opacity:0;transform:translateY(6px);transition:opacity .6s ease,transform .6s ease}
#cta.show{opacity:1;transform:none}
@media(max-width:520px){#cta{flex-direction:column;width:min(300px,100%)}#cta .btn{width:100%}}

#keys{position:fixed;z-index:3;left:50%;transform:translateX(-50%);width:min(1100px,calc(100vw - 2*max(5vw,18px)));
  top:84px;bottom:calc(92px + env(safe-area-inset-bottom));display:none;touch-action:none;cursor:pointer}
body[data-scene=piano] #keys{display:flex}
.key{flex:1;position:relative}
.key span{position:absolute;left:0;right:0;bottom:-2.1rem;text-align:center;font:400 14px var(--pixel);color:var(--faint);transition:color .15s}
.key.down span{color:var(--teal)}
@media(hover:none){.key span{display:none}}
.hint>span{display:none}
body[data-scene=home] .hint .h{display:inline}
body[data-scene=tiger] .hint .t{display:inline}
body[data-scene=piano] .hint .p{display:inline}
@media(hover:none){.fine{display:none!important}}
@media(hover:hover){.coarse{display:none!important}}
</style>
</head>

<canvas id="world" aria-hidden="true"></canvas>

<header>
  <a class="brand" href="#" aria-label="blue tiger inc studios, home"><i class="mark"></i><span>blue tiger<span class="long"> inc studios</span></span></a>
  <nav aria-label="main">
    <a href="#tiger" data-s="tiger">tiger</a>
    <a href="#piano" data-s="piano">piano</a>
    <a class="yt" href="https://youtube.com/@BlueTigerIncStudios" target="_blank" rel="noopener">youtube <svg class="arr" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true"><path d="M3 9l6-6M4 3h5v5"/></svg></a>
  </nav>
</header>

<main id="stage">

</main>

<div id="keys" role="group" aria-label="piano"></div>

  <span class="p"><span class="fine">tap, drag, or play <b>a s d f g h j k</b></span><span class="coarse">tap or drag across the keys</span></span>
</p>

const YT = 'https://youtube.com/@BlueTigerIncStudios';
const $ = s => document.querySelector(s);
const body = document.body, canvas = $('#world'), keysEl = $('#keys'), cta = $('#cta');
const t1 = $('#t1'), t2 = $('#t2'), cur = $('#cur');

let scene = 'home', booted = false;

/* ─────────── hero: typed intro, free typing, commands ─────────── */
let buf = '', typeTok = 0, typedDone = false;
const L1 = 'sup, im the', L2 = 'blue tiger.';
function intro() {
  const tok = ++typeTok; typedDone = false; t1.textContent = t2.textContent = ''; cta.classList.remove('show');
  t1.before(cur);

  let i = 0;
  (function next() {
    if (tok !== typeTok) return;
    if (i >= all.length) { typedDone = true; cta.classList.add('show'); return; }
    const [ch, ln] = all[i++];
    (ln === 1 ? t1 : t2).textContent += ch;
    (ln === 1 ? t1 : t2).after(cur);
    setTimeout(next, reduce ? 0 : 40 + Math.random() * 55 + (ch === ',' || ch === '.' ? 210 : 0) + (i === L1.length + 1 ? 90 : 0));
  })();
}
function renderBuf() {
  typeTok++; typedDone = true; cta.classList.add('show');
  if (!buf) { intro(); return; }
  t1.textContent = buf; t2.textContent = ''; t1.after(cur);
}
const go = n => { location.hash = n === 'home' ? '' : n; route(); };
const COMMANDS = {
  youtube: () => window.open(YT, '_blank', 'noopener'), videos: () => window.open(YT, '_blank', 'noopener'),
  tiger: () => go('tiger'), piano: () => go('piano'), hum: () => go('piano'), home: () => go('home'),

addEventListener('keydown', e => {

  if (scene !== 'home') return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('a,button')) return;

/* ─────────── tiger: a lit pillow of glyphs, eyes that follow the light ─────────── */

    g.lineWidth = 0.05 * s; g.lineCap = 'round'; g.beginPath(); g.moveTo(cx, cy + 0.31 * s); g.lineTo(cx, cy + 0.42 * s);
    g.moveTo(cx - 0.15 * s, cy + 0.49 * s); g.quadraticCurveTo(cx, cy + 0.51 * s, cx, cy + 0.42 * s); g.quadraticCurveTo(cx, cy + 0.51 * s, cx + 0.15 * s, cy + 0.49 * s); g.stroke(); });
  const muzzle = eng.cover(g => { g.fillStyle = '#fff'; both(m => E(g, 0.13 * m, 0.4, 0.19, 0.15)); E(g, 0, 0.31, 0.2, 0.12); E(g, 0, 0.6, 0.2, 0.09); });
  const eyeL = eng.cover(g => { g.fillStyle = '#fff'; E(g, -EY.x, EY.y, EY.rx, EY.ry); });
  const eyeR = eng.cover(g => { g.fillStyle = '#fff'; E(g, EY.x, EY.y, EY.rx, EY.ry); });
  const N = cols * rows;
  T.stripe = new Uint8Array(N); T.muz = new Uint8Array(N); T.eye = new Uint8Array(N);
  for (let i = 0; i < N; i++) { T.stripe[i] = stripe[i] > 0.45; T.muz[i] = muzzle[i] > 0.5; T.eye[i] = eyeL[i] > 0.5 ? 1 : eyeR[i] > 0.5 ? 2 : 0; }
  const carve = eng.blur(Float32Array.from(T.stripe), 1);
  Object.assign(T, eng.relief(T.cov, s * 0.34, carve, s * 0.12));
  T.soft = eng.blur(T.cov, 2); T.shadowLen = s * 0.1;
  T.eyes = [-1, 1].map(m => ({ cx: (cx + EY.x * m * s) / cw, cy: (cy + EY.y * s) / ch, rx: EY.rx * s / cw, ry: EY.ry * s / ch }));
  T.thr = eng.thresholds(cx / cw, cy / ch); T.rev = reduce ? 9 : 0;
}
function drawTiger() {
  const { cols, rows } = S, L = light.cur, lz = 0.8, inv = 1 / Math.hypot(L.x, L.y, lz), Lx = L.x * inv, Ly = L.y * inv, Lz = lz * inv;
  const sdx = -L.x * T.shadowLen / S.cw, sdy = -L.y * T.shadowLen / S.ch, px = clamp(L.x, -1, 1), py = clamp(L.y, -1, 1);
  eng.wipeAll();
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c, rv = clamp((T.rev - T.thr[i]) * 7, 0, 1);
    if (rv <= 0) continue;
    let ci, col;
    if (T.cov[i] > 0.5) {
      const ey = T.eye[i];
      if (ey) {
        const e = T.eyes[ey - 1], dx = (c + 0.5 - e.cx - px * e.rx * 0.5) / (e.rx * 0.3), dy = (r + 0.5 - e.cy - py * e.ry * 0.3) / (e.ry * 0.62);
        if (dx * dx + dy * dy <= 1) continue;
        ci = 9; col = 3;
      } else {
        let v = 0.2 + 0.8 * Math.max(0, T.nx[i] * Lx + T.ny[i] * Ly + T.nz[i] * Lz);
        v = Math.pow(v, 1.1);
        const st = T.stripe[i];
        if (st) v = 0.34 + v * 0.16; else if (T.muz[i]) v = Math.min(1, v + 0.3);
        [ci, col] = glyphFor(v, st); if (st) { ci = Math.max(ci, 4); col = 1; }
      }
    } else {
      const sr = Math.round(r + sdy), sc = Math.round(c + sdx);
      if (sr < 0 || sc < 0 || sr >= rows || sc >= cols) continue;
      const v = T.soft[sr * cols + sc];
      if (v < 0.14) continue;
      ci = v > 0.7 ? 3 : v > 0.4 ? 2 : 1; col = 0;
    }
    if (rv < 1) ci = Math.max(1, (ci * rv) | 0);
    eng.put(c, r, ci, col);
  }
}

/* ─────────── piano: eight shaded columns; a hit sends light and a shockwave down the key ─────────── */
const K = 8, SCALE = [0, 2, 4, 7, 9], KEYMAP = 'asdfghjk';
const Pn = { E: new Float32Array(K), age: new Float32Array(K), hit: new Float32Array(K), was: new Uint8Array(K), x0: 0, x1: 0, y0: 0, y1: 0, kw: 1, raf: 0, last: 0 };
for (let k = 0; k < K; k++) { const d = document.createElement('div'); d.className = 'key'; d.innerHTML = '<span>' + KEYMAP[k] + '</span>'; keysEl.appendChild(d); }
const keyDivs = [...keysEl.children];
function pianoLayout() {
  const r = keysEl.getBoundingClientRect();
  Pn.x0 = Math.round(r.left / S.cw); Pn.x1 = Math.round(r.right / S.cw); Pn.y0 = Math.round(r.top / S.ch); Pn.y1 = Math.round(r.bottom / S.ch);
  Pn.kw = (Pn.x1 - Pn.x0) / K;
}
function drawKey(k) {
  const xa = Math.round(Pn.x0 + k * Pn.kw), xb = Math.round(Pn.x0 + (k + 1) * Pn.kw), { y0, y1 } = Pn, h = y1 - y0;
  eng.wipe(xa, y0, k === K - 1 ? xb + 1 : xb, y1);
  const en = Pn.E[k] + 0.22 * ((k > 0 ? Pn.E[k - 1] : 0) + (k < K - 1 ? Pn.E[k + 1] : 0));
  const mid = (xa + xb) / 2, hw = Math.max(1, (xb - xa) / 2), front = Pn.age[k] * h * 1.1;
  for (let r = y0; r < y1; r++) {
    const edge = r === y0 || r === y1 - 1, dr = Math.abs(r - Pn.hit[k]);
    const base = en * (0.28 + 0.72 * Math.exp(-((dr / (h * 0.6)) ** 2))) + Pn.E[k] * 0.9 * Math.exp(-(((dr - front) / 2.4) ** 2));
    for (let c = xa; c <= (k === K - 1 ? xb : xb - 1); c++) {
      if (c === xa || c === xb) { eng.put(c, r, edge ? 5 : 10, en > 0.25 ? 1 : 0); continue; }
      if (edge) { eng.put(c, r, 3, en > 0.3 ? 2 : 0); continue; }
      const v = base * (1 - 0.4 * (((c + 0.5 - mid) / hw) ** 2));
      if (v < 0.09) { if ((r + c) % 4 === 0) eng.put(c, r, 1, 0); continue; }
      const [ci, col] = glyphFor(v, false); eng.put(c, r, ci, col);
    }
  }
}
const drawKeys = () => { for (let k = 0; k < K; k++) drawKey(k); };
function pianoTick(t) {
  Pn.raf = 0; if (scene !== 'piano') return;
  if (t - Pn.last < 30) { Pn.raf = requestAnimationFrame(pianoTick); return; }
  const dt = Math.min(0.1, (t - Pn.last) / 1000); Pn.last = t;
  let live = false;
  for (let k = 0; k < K; k++) { Pn.E[k] *= Math.exp(-dt * 2.4); Pn.age[k] += dt; if (Pn.E[k] < 0.01) Pn.E[k] = 0; }
  const act = new Uint8Array(K);
  for (let k = 0; k < K; k++) if (Pn.E[k] > 0 || Pn.was[k]) { act[Math.max(0, k - 1)] = act[k] = act[Math.min(K - 1, k + 1)] = 1; }
  for (let k = 0; k < K; k++) if (act[k]) drawKey(k);
  for (let k = 0; k < K; k++) { Pn.was[k] = Pn.E[k] > 0 ? 1 : 0; if (Pn.E[k] > 0) live = true; }
  if (live) Pn.raf = requestAnimationFrame(pianoTick);
}
const kick = () => { if (!Pn.raf) { Pn.last = performance.now() - 40; Pn.raf = requestAnimationFrame(pianoTick); } };

let AC, master, echo;
function initAudio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.6; master.connect(AC.destination);
    echo = AC.createDelay(); echo.delayTime.value = 0.32;
    const fb = AC.createGain(), wet = AC.createGain(); fb.gain.value = 0.36; wet.gain.value = 0.38;
    echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(master);
  }
  if (AC.state === 'suspended') AC.resume();
}
function tone(k) {
  initAudio();
  const f = 220 * 2 ** ((SCALE[k % 5] + 12 * Math.floor(k / 5)) / 12), t = AC.currentTime, g = AC.createGain();
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.34, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
  const o1 = AC.createOscillator(), o2 = AC.createOscillator(), g2 = AC.createGain();
  o1.type = 'triangle'; o1.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f * 2.003; g2.gain.value = 0.25;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(master); g.connect(echo);
  o1.start(t); o2.start(t); o1.stop(t + 1.7); o2.stop(t + 1.7);
}
function hit(k, y) {
  if (k < 0 || k >= K) return;
  tone(k); Pn.E[k] = 1; Pn.age[k] = 0; Pn.hit[k] = clamp(Math.round(y / S.ch), Pn.y0, Pn.y1 - 1);
  keyDivs[k].classList.add('down'); setTimeout(() => keyDivs[k].classList.remove('down'), 160);
  kick();
}
function pianoKey(e) {
  if (e.repeat) return;
  const k = KEYMAP.indexOf(e.key.toLowerCase()); if (k < 0) return;
  hit(k, (Pn.y0 + Pn.y1 + (Math.random() - 0.5) * (Pn.y1 - Pn.y0) * 0.6) / 2 * S.ch);
}
const down = new Map();
const keyAt = x => { const r = keysEl.getBoundingClientRect(); return Math.floor((x - r.left) / r.width * K); };
keysEl.addEventListener('pointerdown', e => { keysEl.setPointerCapture(e.pointerId); const k = keyAt(e.clientX); down.set(e.pointerId, k); hit(k, e.clientY); });
keysEl.addEventListener('pointermove', e => { if (!down.has(e.pointerId)) return; const k = keyAt(e.clientX); if (k !== down.get(e.pointerId)) { down.set(e.pointerId, k); hit(k, e.clientY); } });
['pointerup', 'pointercancel'].forEach(n => keysEl.addEventListener(n, e => down.delete(e.pointerId)));

/* ─────────── light, routing, resize ─────────── */
const light = eng.createLight(() => { if (scene !== 'piano') drawTiger(); });
addEventListener('pointermove', e => { if (scene !== 'piano') light.set(...eng.lightFromPointer(e.clientX, e.clientY)); }, { passive: true });
addEventListener('pointerdown', e => { if (scene !== 'piano') light.set(...eng.lightFromPointer(e.clientX, e.clientY)); }, { passive: true });
document.addEventListener('pointerleave', () => { if (scene !== 'piano' && matchMedia('(hover:hover)').matches) light.set(-0.55, -0.7); });

function paint() {
  if (scene === 'piano') { eng.wipeAll(); pianoLayout(); drawKeys(); }
  else drawTiger();
}
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const s = h === 'piano' || h === 'hum' ? 'piano' : h === 'tiger' ? 'tiger' : 'home';
  if (booted && s === scene) return;
  const prev = scene; scene = s; body.dataset.scene = s;
  document.title = s === 'home' ? 'Blue Tiger Inc Studios' : s + ' · Blue Tiger Inc Studios';
  document.querySelectorAll('nav a[data-s]').forEach(a => a.classList.toggle('on', a.dataset.s === s));
  if (!booted) return;
  if (s === 'piano') { try { initAudio(); } catch (e) {} }
  if ((prev === 'piano') !== (s === 'piano')) {
    canvas.classList.add('swap');
    setTimeout(() => { paint(); canvas.classList.remove('swap'); }, 190);
  }
  if (s === 'home' && !typedDone) intro();
}
addEventListener('hashchange', route);

let rz = 0, lastW = innerWidth, lastH = innerHeight;
addEventListener('resize', () => {
  if (innerWidth === lastW && Math.abs(innerHeight - lastH) < 140) return;   // phone address bar
  clearTimeout(rz); rz = setTimeout(() => { lastW = innerWidth; lastH = innerHeight; eng.layout(); buildTiger(); T.rev = 9; paint(); }, 160);
});

async function start() {
  try { await Promise.race([document.fonts.load('16px "Geist Pixel"'), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
  eng.layout(); buildTiger();
  route(); booted = true;
  const first = scene;
  if (first === 'piano') { paint(); } else { T.rev = 0; eng.tween(1500, k => { T.rev = k * 1.35; drawTiger(); }); }
  if (first === 'home') intro(); else { typedDone = false; }
  document.fonts.ready.then(() => { eng.layout(); buildTiger(); T.rev = 9; paint(); });
}
start();
})();
</script>
