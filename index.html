<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blue Tiger Inc Studios</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #070707;
            --txt: #ebebeb;
            --teal: #00c4b6;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh; 
            background-color: var(--bg);
            font-family: 'DM Sans', sans-serif;
            overflow: hidden; 
            touch-action: none; 
            user-select: none;
            
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 3vw 3vw;
            background-position: center center;
        }

        #mural-link {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding-left: 6vw;
            box-sizing: border-box;
            text-decoration: none;
            cursor: crosshair;
        }

        .row {
            display: flex;
            gap: 0.25em; /* Tightly kerned word spacing */
        }

        .word {
            font-size: clamp(4rem, 14vw, 16rem);
            font-weight: 900;
            /* FIXED: 0.95 clears the 'p' and 't' overlap perfectly */
            line-height: 0.95; 
            letter-spacing: -0.05em;
            text-transform: lowercase; 
            margin: 0;
            color: var(--txt);
            white-space: nowrap;
        }

        .accent .word {
            color: var(--teal);
        }

        .char {
            display: inline-block;
            will-change: transform; 
        }

        /* --- THE MOBILE OPTIMIZATION --- */
        @media (max-width: 768px) {
            body, html {
                background-size: 6vw 6vw; 
            }
            .row {
                flex-direction: column; 
                gap: 0; 
            }
            .word {
                /* MASSIVE: Pushed to the absolute limit before 'tiger.' overflows */
                font-size: 18vw; 
                /* Extra breathing room to protect descenders on narrow screens */
                line-height: 0.98; 
            }
        }
    </style>
</head>
<body>

    <a href="https://youtube.com/@BlueTigerIncStudios" target="_blank" rel="noopener noreferrer" id="mural-link">
        <div class="row">
            <div class="word">sup,</div>
        </div>
        <div class="row">
            <div class="word">im</div>
            <div class="word">the</div>
        </div>
        <div class="row accent">
            <div class="word">blue</div>
            <div class="word">tiger.</div>
        </div>
    </a>

    <script>
        // --- 1. STRUCTURAL TYPOGRAPHY PREP --- //
        
        const words = document.querySelectorAll('.word');
        const charData = []; 

        words.forEach(word => {
            const text = word.innerText;
            word.innerHTML = ''; 
            
            text.split('').forEach(char => {
                const span = document.createElement('span');
                span.className = 'char';
                span.innerText = char;
                word.appendChild(span);
                
                charData.push({
                    el: span,
                    homeX: 0, homeY: 0, 
                    tx: 0, ty: 0,       
                    vx: 0, vy: 0        
                });
            });
        });

        function calculateHomes() {
            charData.forEach(c => {
                c.el.style.transform = `translate3d(0px, 0px, 0)`;
                c.tx = 0; c.ty = 0; c.vx = 0; c.vy = 0;
                
                const rect = c.el.getBoundingClientRect();
                c.homeX = rect.left + rect.width / 2;
                c.homeY = rect.top + rect.height / 2;
            });
        }
        
        document.fonts.ready.then(calculateHomes);
        
        // --- 2. RESPONSIVE PHYSICS ENGINE --- //
        
        let getRadius = () => window.innerWidth < 768 ? 80 : 160;
        let pointer = { x: -1000, y: -1000, radius: getRadius() };
        let isTouching = false;

        window.addEventListener('resize', () => {
            calculateHomes();
            pointer.radius = getRadius();
        });

        function renderPhysics() {
            charData.forEach(c => {
                let currentX = c.homeX + c.tx;
                let currentY = c.homeY + c.ty;
                
                let dx = pointer.x - currentX;
                let dy = pointer.y - currentY;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < pointer.radius && isTouching) {
                    let force = (pointer.radius - dist) / pointer.radius;
                    let repulsion = window.innerWidth < 768 ? 22 : 15;
                    c.vx -= (dx / dist) * force * repulsion; 
                    c.vy -= (dy / dist) * force * repulsion;
                }

                c.vx += (0 - c.tx) * 0.12; 
                c.vy += (0 - c.ty) * 0.12;

                c.vx *= 0.8;
                c.vy *= 0.8;

                c.tx += c.vx;
                c.ty += c.vy;

                c.el.style.transform = `translate3d(${c.tx}px, ${c.ty}px, 0) rotate(${c.vx * 0.5}deg)`;
            });

            requestAnimationFrame(renderPhysics);
        }
        renderPhysics();

        // --- 3. INPUT HANDLING --- //

        const updatePointer = (x, y) => {
            pointer.x = x;
            pointer.y = y;
            isTouching = true;
        };

        window.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
        window.addEventListener('mouseleave', () => isTouching = false);

        window.addEventListener('touchmove', (e) => {
            updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        
        window.addEventListener('touchstart', (e) => {
            updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        
        const clearPointer = () => {
            isTouching = false;
            pointer.x = -1000; 
            pointer.y = -1000;
        };

        window.addEventListener('touchend', clearPointer);
        window.addEventListener('touchcancel', clearPointer);

        // --- 4. SMART LINK LOGIC --- //
        const link = document.getElementById('mural-link');
        let startX, startY;

        link.addEventListener('pointerdown', (e) => {
            startX = e.clientX; startY = e.clientY;
        });

        link.addEventListener('click', (e) => {
            let dx = Math.abs(e.clientX - startX);
            let dy = Math.abs(e.clientY - startY);
            if (dx > 15 || dy > 15) {
                e.preventDefault(); 
            }
        });

    </script>
</body>
</html>
